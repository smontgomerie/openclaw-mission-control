name: openclaw-mission-control

x-backend-image: &backend-image
  image: openclaw-mission-control-backend:latest
  build:
    # Build from repo root so the backend image can include repo-level assets
    # like `backend/templates/`.
    context: .
    dockerfile: backend/Dockerfile
    args:
      # Select which shared WhisperX/PyTorch base image mission-control builds on.
      # Keep CPU as the safe default; opt into CUDA with, for example:
      #   OPENCLAW_TORCH_BACKEND=cu128 ./scripts/ensure_openclaw_backend_base.sh
      #   OPENCLAW_TORCH_BACKEND=cu128 docker compose ...
      OPENCLAW_TORCH_BACKEND: ${OPENCLAW_TORCH_BACKEND:-cpu}
      OPENCLAW_BACKEND_BASE_IMAGE: ${OPENCLAW_BACKEND_BASE_IMAGE:-${OPENCLAW_BACKEND_BASE_REPOSITORY:-openclaw-whisperx-base}:${OPENCLAW_TORCH_BACKEND:-cpu}}
      APP_UID: ${OPENCLAW_APP_UID:-1000}
      APP_GID: ${OPENCLAW_APP_GID:-1000}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mission_control}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    <<: *backend-image
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Override localhost defaults for container networking
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mission_control}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      AUTH_MODE: ${AUTH_MODE}
      LOCAL_AUTH_TOKEN: ${LOCAL_AUTH_TOKEN}
      # Better Auth backend mode (AUTH_MODE=betterauth): verify the Next.js
      # app's JWKS/JWTs statelessly. Left unset, the backend fails to start
      # in betterauth mode with a clear error (the local flow is unaffected).
      BETTER_AUTH_JWKS_URL: ${BETTER_AUTH_JWKS_URL:-}
      BETTER_AUTH_ISSUER: ${BETTER_AUTH_ISSUER:-}
      BETTER_AUTH_AUDIENCE: ${BETTER_AUTH_AUDIENCE:-}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      RQ_REDIS_URL: redis://redis:6379/0
      OPENCLAW_GATEWAY_DEVICE_IDENTITY_PATH: /home/appuser/.openclaw/identity/device.json
      OPENCLAW_SHARED_WORKSPACE_ROOT: /home/appuser/.openclaw/workspace-shared
      OPENCLAW_TRANSCRIPTIONS_PYTHON_BIN: ${OPENCLAW_TRANSCRIPTIONS_PYTHON_BIN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      HF_HOME: /home/appuser/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /home/appuser/.cache/huggingface/hub
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - gateway_device_identity:/home/appuser/.openclaw/identity
      - ${OPENCLAW_SHARED_WORKSPACE_PATH:-${HOME}/.openclaw-docker/workspace}:/home/appuser/.openclaw/workspace-shared
      - ${OPENCLAW_HUGGINGFACE_CACHE_PATH:-${HOME}/.cache/huggingface}:/home/appuser/.cache/huggingface
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-auto}
        NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE}
    restart: unless-stopped
    # Optional, user-managed env file.
    # IMPORTANT: do NOT load `.env.example` here — it is a template whose
    # values (e.g. NEXT_PUBLIC_AUTH_MODE=local) would silently override the
    # mode you intend to run in.
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-auto}
      NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE}
      # Better Auth server at /api/auth/* (Google sign-in, JWKS/JWT for the
      # backend, API keys). All optional at compose level: unset -> the
      # /api/auth/* routes fail fast with a clear error and the local
      # flow keeps working. Required (non-placeholder) once you want
      # /api/auth/* to function. See docs/reference/authentication.md.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_GOOGLE_CLIENT_ID: ${BETTER_AUTH_GOOGLE_CLIENT_ID:-}
      BETTER_AUTH_GOOGLE_CLIENT_SECRET: ${BETTER_AUTH_GOOGLE_CLIENT_SECRET:-}
      BETTER_AUTH_ALLOWED_GOOGLE_DOMAINS: ${BETTER_AUTH_ALLOWED_GOOGLE_DOMAINS:-}
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL:-http://localhost:3000}
      # Plain postgresql:// URL to the shared db service. The backend's
      # postgresql+psycopg:// DATABASE_URL is backend-only and not reusable
      # here.
      BETTER_AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mission_control}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    develop:
      watch:
        # Rebuild frontend image when UI source or build config changes.
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/next.config.ts
        - action: rebuild
          path: ./frontend/postcss.config.js
        - action: rebuild
          path: ./frontend/tailwind.config.cjs
        - action: rebuild
          path: ./frontend/tsconfig.json

  webhook-worker:
    image: openclaw-mission-control-backend:latest
    command: ["python", "scripts/rq-docker", "worker"]
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mission_control}
      AUTH_MODE: ${AUTH_MODE}
      LOCAL_AUTH_TOKEN: ${LOCAL_AUTH_TOKEN}
      # Better Auth backend mode (AUTH_MODE=betterauth): verify the Next.js
      # app's JWKS/JWTs statelessly. Left unset, the backend fails to start
      # in betterauth mode with a clear error (the local flow is unaffected).
      BETTER_AUTH_JWKS_URL: ${BETTER_AUTH_JWKS_URL:-}
      BETTER_AUTH_ISSUER: ${BETTER_AUTH_ISSUER:-}
      BETTER_AUTH_AUDIENCE: ${BETTER_AUTH_AUDIENCE:-}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      RQ_REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-default}
      RQ_DISPATCH_THROTTLE_SECONDS: ${RQ_DISPATCH_THROTTLE_SECONDS:-2.0}
      RQ_DISPATCH_MAX_RETRIES: ${RQ_DISPATCH_MAX_RETRIES:-3}
      OPENCLAW_GATEWAY_DEVICE_IDENTITY_PATH: /home/appuser/.openclaw/identity/device.json
      OPENCLAW_SHARED_WORKSPACE_ROOT: /home/appuser/.openclaw/workspace-shared
      OPENCLAW_TRANSCRIPTIONS_PYTHON_BIN: ${OPENCLAW_TRANSCRIPTIONS_PYTHON_BIN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      HF_HOME: /home/appuser/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /home/appuser/.cache/huggingface/hub
    volumes:
      - gateway_device_identity:/home/appuser/.openclaw/identity
      - ${OPENCLAW_SHARED_WORKSPACE_PATH:-${HOME}/.openclaw-docker/workspace}:/home/appuser/.openclaw/workspace-shared
      - ${OPENCLAW_HUGGINGFACE_CACHE_PATH:-${HOME}/.cache/huggingface}:/home/appuser/.cache/huggingface
    restart: unless-stopped

volumes:
  postgres_data:
  gateway_device_identity:
